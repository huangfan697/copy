server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://124.222.183.199:8808/wrong_note?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 阿里云 OSS 配置
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:wrong-note}
    url-prefix: ${OSS_URL_PREFIX:https://wrong-note.oss-cn-hangzhou.aliyuncs.com/}

# 通义千问 DashScope 配置
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  model: qwen-vl-plus
